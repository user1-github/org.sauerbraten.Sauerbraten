id: org.sauerbraten.Sauerbraten
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: sauerbraten
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --persist=.sauerbraten
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_mixer.json

  - name: enet
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      - '*.a'
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: sauerbraten
    buildsystem: cmake-ninja
    no-make-install: true
    subdir: src
    sources:
      - type: archive
        url: https://sourceforge.net/projects/sauerbraten/files/sauerbraten/2020_11_29/sauerbraten_2020_12_29_linux.tar.bz2
        sha256: cdba7c4a47cefd30d0afdd6a912199a1384319cf1619923cb7189e72e468be70
      - type: file
        path: sauerbraten.sh
      - type: file
        path: org.sauerbraten.Sauerbraten.desktop
      - type: patch
        path: gcc16.patch
      - type: shell
        commands:
          - cp CMakeLists.txt -t src
    post-install:
      - mkdir -p /app/share/sauerbraten
      - cp -a ../data ../packages /app/share/sauerbraten
      - install -Dm755 sauerbraten_linux -t /app/bin
      - install -Dm755 ../sauerbraten.sh /app/bin/sauerbraten
      - install -Dm644 ../data/cube.png /app/share/icons/hicolor/256x256/apps/org.sauerbraten.Sauerbraten.png
      - install -Dm644 ../org.sauerbraten.Sauerbraten.desktop -t /app/share/applications
